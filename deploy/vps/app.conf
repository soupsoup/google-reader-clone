# Read by deploy.sh and install.sh.
NAME=foogle
BRANCH=main

# Vite builds the reader into dist/. VITE_* values (the site's own address and
# its public anon key) are baked in at build time, so foogle-deploy.service
# loads /etc/foogle.env. foogle.service is only the feed fetcher
# (server/fetch-feeds.mjs); nginx serves the built files.
build_release() {   # $1 = release directory to create (relative to the repo)
  rm -rf dist
  npm run build
  cp -r dist "$1"
}
