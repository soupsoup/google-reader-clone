# /etc/nginx/sites-available/foogle-db-gateway
# Local only, for checks from the VPS itself (the app uses https://reader.antderosa.com).
server {
    listen 127.0.0.1:54370;
    server_name _;
    client_max_body_size 25m;
    large_client_header_buffers 4 64k;
    proxy_buffer_size 128k;
    proxy_buffers 8 128k;
    proxy_busy_buffers_size 256k;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $remote_addr;

    location /rest/v1/ { proxy_pass http://127.0.0.1:54372/; }
    location /auth/v1/ { proxy_pass http://127.0.0.1:54371/; }
    location / { return 404; }
}
