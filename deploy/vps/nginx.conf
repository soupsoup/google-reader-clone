# /etc/nginx/sites-available/foogle  (certbot --nginx adds HTTPS here)
server {
    listen 80;
    listen [::]:80;
    server_name foogle.antderosa.com;
    root /var/www/foogle/.releases/current;
    index index.html;
    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    large_client_header_buffers 4 64k;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;

    # What the app used Supabase for, now on this server (database/README.md).
    location ^~ /rest/v1/ {
        client_max_body_size 10m;
        proxy_buffer_size 128k;
        proxy_buffers 8 128k;
        proxy_busy_buffers_size 256k;
        proxy_pass http://127.0.0.1:54372/;
    }
    location ^~ /auth/v1/ { proxy_pass http://127.0.0.1:54371/; }
    location ^~ /functions/v1/ { proxy_read_timeout 60s; proxy_pass http://127.0.0.1:4417; }

    location ^~ /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri /index.html; }
}
